name: Peek site
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to capture"
        required: true
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - name: Capture
        env:
          URL: ${{ inputs.url }}
        run: |
          cat > peek.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "fs";
          const b = await chromium.launch();
          for (const [n, w, h] of [["mobile", 390, 844], ["desktop", 1440, 900]]) {
            const pg = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: n === "mobile" ? 2 : 1 });
            await pg.goto(process.env.URL, { waitUntil: "networkidle" });
            await pg.waitForTimeout(2500);
            await pg.screenshot({ path: `${n}-full.png`, fullPage: true });
            if (n === "desktop") fs.writeFileSync("page.html", await pg.content());
          }
          await b.close();
          JS
          node peek.mjs
      - name: Push captures to the peek branch
        run: |
          mkdir out && mv *.png page.html out/ && cd out
          git init -q && git checkout -q -b peek
          git config user.name peek && git config user.email peek@users.noreply.github.com
          git add . && git commit -qm "capture"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" peek

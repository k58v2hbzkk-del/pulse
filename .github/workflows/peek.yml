name: Peek site
on:
  workflow_dispatch:
    inputs:
      url: { description: "URL to capture", required: true }
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: |
          cat > peek.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [n, w, h] of [["mobile", 390, 844], ["desktop", 1440, 900]]) {
            const pg = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: n === "mobile" ? 2 : 1 });
            await pg.goto(process.env.URL, { waitUntil: "networkidle" }); await pg.waitForTimeout(2500);
            await pg.screenshot({ path: `${n}-full.png`, fullPage: true });
            if (n === "desktop") require_html: { const fs = await import("fs"); fs.writeFileSync("page.html", await pg.content()); }
          }
          await b.close();
          JS
          URL="${{ inputs.url }}" node peek.mjs
      - uses: actions/upload-artifact@v4
        with: { name: peek, path: |
            *.png
            page.html }

# Run from the Actions tab: builds the program, deploys it to devnet, then creates the markets.
name: Deploy to devnet
on:
  workflow_dispatch:
    inputs:
      solana_version:
        description: Solana CLI version
        default: v2.1.21
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RPC_URL: ${{ secrets.RPC_URL || 'https://api.devnet.solana.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${{ inputs.solana_version }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Write keys
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PROGRAM_KEY: ${{ secrets.PROGRAM_KEY }}
        run: |
          node keeper/keyfile.js admin.json
          ADMIN_KEY="$PROGRAM_KEY" node keeper/keyfile.js program.json
          solana config set --url "$RPC_URL" --keypair admin.json
          echo "Deployer: $(solana address)  balance: $(solana balance)"
      - name: Build program
        run: cargo build-sbf --manifest-path programs/pulse/Cargo.toml
      - name: Deploy (needs ~3-5 devnet SOL on the deployer)
        run: |
          ls -la target/deploy/
          solana airdrop 2 || echo "airdrop rate-limited; using existing balance"
          PID=$(solana address -k program.json)
          NEW=$(stat -c%s target/deploy/pulse.so)
          CUR=$(solana program show $PID --url "$RPC_URL" --output json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('dataLen',0))" || echo 0)
          echo "program size: new=$NEW on-chain=$CUR"
          if [ "$CUR" -gt 0 ] && [ "$NEW" -gt "$CUR" ]; then
            solana program extend $PID $((NEW - CUR + 20480)) --keypair admin.json --url "$RPC_URL"
          fi
          solana program deploy target/deploy/pulse.so --program-id program.json --keypair admin.json --url "$RPC_URL"
      - name: Create config + markets
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: node keeper/setup.js
      - name: Clean up keys
        if: always()
        run: rm -f admin.json program.json

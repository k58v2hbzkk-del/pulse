name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pool math + layout tests
        run: cargo test --lib
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Build program for Solana
        run: cargo build-sbf --manifest-path programs/pulse/Cargo.toml ${{ vars.SBF_TOOLS && format('--tools-version {0}', vars.SBF_TOOLS) || '' }}
      - name: Program size
        run: ls -la target/deploy/
